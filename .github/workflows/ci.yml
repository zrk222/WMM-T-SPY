name: ci

on:
  push:
    branches: [main]
    paths: ["ops/**", ".github/workflows/**"]
  pull_request:
    paths: ["ops/**", ".github/workflows/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/cloudops_test
      MONGODB_DB: cloudops_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret
      NODE_ENV: development
      RATE_LIMIT_MULTIPLIER: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Upload coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: ops/.next
          retention-days: 3
